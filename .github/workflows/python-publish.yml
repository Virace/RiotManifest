name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish, for example v2.4.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-release-source:
    name: Validate Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}

    steps:
      - name: Resolve release tag
        id: input
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "tag_name=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.input.outputs.tag_name }}
          fetch-depth: 0

      - name: Ensure release tag commit comes from main
        run: |
          git fetch origin main
          TAG_COMMIT="$(git rev-list -n 1 "${{ steps.input.outputs.tag_name }}")"
          MAIN_COMMIT="$(git rev-parse origin/main)"
          echo "tag_commit=${TAG_COMMIT}"
          echo "main_commit=${MAIN_COMMIT}"
          if ! git merge-base --is-ancestor "${TAG_COMMIT}" "origin/main"; then
            echo "Release tag commit is not from main branch."
            exit 1
          fi

      - name: Ensure tag and pyproject version match
        id: version
        run: |
          TAG_NAME="${{ steps.input.outputs.tag_name }}"
          TAG_VERSION="${TAG_NAME#v}"
          PROJECT_VERSION="$(grep -E '^version[[:space:]]*=' pyproject.toml | head -n1 | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)"/\1/')"
          if [[ -z "${PROJECT_VERSION}" ]]; then
            echo "::error title=缺少版本字段::pyproject.toml 中未找到可解析的 version 字段"
            exit 1
          fi

          echo "tag_name=${TAG_NAME}"
          echo "tag_version=${TAG_VERSION}"
          echo "project_version=${PROJECT_VERSION}"

          if [[ "${PROJECT_VERSION}" != "${TAG_VERSION}" ]]; then
            echo "::error title=版本不一致::pyproject.toml=${PROJECT_VERSION}, tag=${TAG_NAME}"
            exit 1
          fi

          echo "version=${PROJECT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

  release-build:
    name: Build Distributions
    runs-on: ubuntu-latest
    needs:
      - validate-release-source

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-release-source.outputs.tag_name }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build release distributions
        run: |
          python -m pip install build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    name: Publish to PyPI (Trusted Publishing)
    runs-on: ubuntu-latest
    needs:
      - validate-release-source
      - release-build
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # Dedicated environments with protections for publishing are strongly recommended.
    # For more information, see: https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment#deployment-protection-rules
    environment:
      name: pypi
      url: https://pypi.org/project/riotmanifest/${{ needs.validate-release-source.outputs.version }}/

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
